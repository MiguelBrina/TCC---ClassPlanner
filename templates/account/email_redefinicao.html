<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Redefinição de senha</title>
</head>

<body>

    <h2>Redefinição de senha — ClassPlanner</h2>

    <p>
        Olá {{ user.first_name|default:user.username }},
    </p>

    <p>
        Recebemos uma solicitação para redefinir sua senha.
    </p>

    <p>
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Redefinir minha senha</a>
    </p>

    <p>
        Se você não solicitou essa alteração, ignore este e-mail.
    </p>

</body>
</html>
