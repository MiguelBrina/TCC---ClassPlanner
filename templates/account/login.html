{% extends "base.html" %}

{% block content %}

<h1>Entrar</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        name="senha"
        required
    >

    <button type="submit">
        Entrar
    </button>

</form>

<p>
    <a href="{% url 'cadastro' %}">
        Criar conta
    </a>
</p>

<p>
    <a href="{% url 'esqueci_senha' %}">
        Esqueci minha senha
    </a>
</p>

{% endblock %}
