{% extends "base.html" %}

{% block title %}Entrar - ClassPlanner{% endblock %}

{% block content %}
<div class="flex-center" style="min-height: 70vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 class="text-center" style="margin-bottom: 0.5rem;">Entrar</h2>
        <p class="text-muted text-center" style="margin-bottom: 1.5rem;">Acesse sua conta do ClassPlanner</p>

        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Usuário / E-mail</label>
                <input type="text" name="username" class="form-control" required placeholder="Seu usuário">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Senha</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
        </form>

        <p class="text-muted text-center" style="margin-top: 1.5rem; font-size: 0.9rem;">
            Ainda não tem conta? <a href="{% url 'cadastro' %}" style="text-decoration: underline;">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
