{% extends "base.html" %}

{% block content %}

<h1>Criar conta</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <label for="nome">
        Nome Completo
    </label>

    <input
        type="text"
        id="nome"
        name="nome"
        required
    >

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        name="senha"
        required
    >

    <label for="confirmar_senha">
        Confirmar senha
    </label>

    <input
        type="password"
        id="confirmar_senha"
        name="confirmar_senha"
        required
    >

    <button type="submit">
        Cadastrar
    </button>

</form>

    <p>
    <a href="{% url 'login' %}">
        Já tenho conta
    </a>

{% endblock %}
